version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: chat_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      args:
        # Pass the backend URL to the Vite build process
        - VITE_API_URL=http://localhost:8000
    container_name: chat_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped


# up - start container  , --build -Forces Docker to build the images from the Dockerfiles first.
#-d - Detached mode (runs in the background).
# down - stop container
#docker compose up --build -d
